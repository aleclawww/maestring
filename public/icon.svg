<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Maestring favicon v2 — 2026-05-25, iteration 2. Matches the actual wordmark aesthetic: light surface (slate-50 F8FAFC), black M (slate-900 0F172A), gradient dot (indigo to violet, the v2 brand gradient). Designed for 16px readability: stroke-width 18 keeps the M bold at small sizes; dot radius 9 keeps the brand pixel cluster visible. See scripts/render-icons.ts for raster generation. -->
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" ry="22" fill="#F8FAFC"/>

  <path
    d="M 22 72 L 22 32 L 43 56 L 65 32 L 65 72"
    fill="none"
    stroke="#0F172A"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <circle cx="84" cy="72" r="9" fill="url(#brand)"/>
</svg>
